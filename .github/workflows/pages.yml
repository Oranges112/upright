# Publishes the no-server version of Upright to GitHub Pages:
# https://<user>.github.io/<repo>/
# Everything runs in the visitor's browser; their data stays on their device.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages can only serve plain files, so leave out the server routes
      # (sync + background push). The app falls back to on-device mode without them.
      - name: Remove server routes
        run: rm -rf src/app/api

      - name: Build static site
        run: npx next build
        env:
          GITHUB_PAGES: "1"
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
